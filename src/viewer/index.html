<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Atlas - Repository Explorer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            height: 100vh;
            background: #f5f5f5;
        }

        .sidebar {
            width: 300px;
            background: #2c3e50;
            color: #ecf0f1;
            padding: 20px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #3498db;
        }

        .sidebar .scope {
            font-size: 14px;
            color: #95a5a6;
            margin-bottom: 20px;
        }

        .search {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: none;
            border-radius: 4px;
            background: #34495e;
            color: #ecf0f1;
            font-size: 14px;
        }

        .search::placeholder {
            color: #95a5a6;
        }

        .nav-section {
            margin-bottom: 10px;
        }

        .nav-section a {
            display: block;
            padding: 10px;
            color: #ecf0f1;
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .nav-section a:hover {
            background: #34495e;
        }

        .nav-section a.active {
            background: #3498db;
        }

        .main {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            background: #fff;
        }

        .metadata {
            background: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .metadata h2 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .metadata .info {
            color: #7f8c8d;
            font-size: 14px;
        }

        .section {
            margin-bottom: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid #ecf0f1;
        }

        .section:last-child {
            border-bottom: none;
        }

        .section h2 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .section-content {
            line-height: 1.6;
            color: #34495e;
        }

        .section-content h1, .section-content h2, .section-content h3 {
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .section-content ul, .section-content ol {
            margin-left: 20px;
            margin-bottom: 10px;
        }

        .section-content code {
            background: #ecf0f1;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .section-content pre {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 10px 0;
        }

        .section-content pre code {
            background: none;
            padding: 0;
            color: #ecf0f1;
        }

        .mermaid-diagram {
            margin: 20px 0;
            padding: 20px;
            background: #fff;
            border: 1px solid #ecf0f1;
            border-radius: 8px;
        }

        .error {
            background: #e74c3c;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1>Code Atlas</h1>
        <div class="scope" id="scopeInfo">Loading...</div>
        <input type="text" class="search" id="searchInput" placeholder="Search sections...">
        <div id="navigation"></div>
    </div>

    <div class="main" id="mainContent">
        <div class="loading">Loading report...</div>
    </div>

    <script>
        // Initialize Mermaid
        mermaid.initialize({ startOnLoad: false, theme: 'default' });

        let currentReport = null;

        // Get report path from URL query parameter or use default
        const params = new URLSearchParams(window.location.search);
        const reportPath = params.get('report') || 'report.json';

        // Load and render report
        async function loadReport() {
            try {
                const response = await fetch(reportPath);
                if (!response.ok) {
                    throw new Error(`Failed to load report: ${response.statusText}`);
                }

                currentReport = await response.json();
                renderReport();
            } catch (error) {
                document.getElementById('mainContent').innerHTML = `
                    <div class="error">
                        <h2>Error Loading Report</h2>
                        <p>${error.message}</p>
                        <p>Make sure you have run 'repoexplain scan' first.</p>
                    </div>
                `;
            }
        }

        function renderReport() {
            if (!currentReport) return;

            const { metadata, sections } = currentReport;

            // Update scope info
            document.getElementById('scopeInfo').textContent =
                `${metadata.scope}: ${metadata.scopeValue}`;

            // Render navigation
            const nav = document.getElementById('navigation');
            nav.innerHTML = sections.map(section => `
                <div class="nav-section">
                    <a href="#${section.id}" data-section="${section.id}">
                        ${section.title}
                    </a>
                </div>
            `).join('');

            // Render main content
            const main = document.getElementById('mainContent');

            const metadataHtml = `
                <div class="metadata">
                    <h2>${metadata.scope}: ${metadata.scopeValue}</h2>
                    <div class="info">
                        Generated: ${new Date(metadata.generatedAt).toLocaleString()}<br>
                        Files analyzed: ${metadata.filesAnalyzed}<br>
                        Tool version: ${metadata.toolVersion}
                    </div>
                </div>
            `;

            const sectionsHtml = sections.map(section => `
                <div class="section" id="${section.id}">
                    <h2>${section.title}</h2>
                    <div class="section-content">
                        ${marked.parse(section.content || '')}
                    </div>
                    ${section.mermaid ? `<div class="mermaid-diagram mermaid">${section.mermaid}</div>` : ''}
                </div>
            `).join('');

            main.innerHTML = metadataHtml + sectionsHtml;

            // Render Mermaid diagrams
            mermaid.run({
                querySelector: '.mermaid-diagram'
            });

            // Set up navigation click handlers
            document.querySelectorAll('.nav-section a').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const sectionId = link.dataset.section;
                    document.getElementById(sectionId)?.scrollIntoView({ behavior: 'smooth' });

                    // Update active state
                    document.querySelectorAll('.nav-section a').forEach(a => a.classList.remove('active'));
                    link.classList.add('active');
                });
            });
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            document.querySelectorAll('.nav-section').forEach(section => {
                const text = section.textContent.toLowerCase();
                section.style.display = text.includes(query) ? 'block' : 'none';
            });
        });

        // Load report on page load
        loadReport();
    </script>
</body>
</html>
